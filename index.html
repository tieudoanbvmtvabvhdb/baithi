<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống thi trắc nghiệm - Tiểu đoàn BVMT và BVHĐB</title>
    <style>
        /* Cấu hình chung */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Times New Roman', Times, serif; }
        body {
            background-color: #0b1a30;
            background-image: linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; align-items: center; }
        
        /* HEADER (TIÊU ĐỀ) */
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { color: #ffcc00; font-size: 28px; text-transform: uppercase; margin-bottom: 8px; text-shadow: 2px 2px 4px rgba(0,0,0,0.6); letter-spacing: 1px; }
        .header h2 { color: #ffcc00; font-size: 22px; text-transform: uppercase; margin-bottom: 8px; text-shadow: 2px 2px 4px rgba(0,0,0,0.6); }
        .header h3 { color: #ffffff; font-size: 26px; text-transform: uppercase; margin-bottom: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.6); font-weight: bold; }
        
        .logo-container img { width: 100px; height: auto; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.8)); }

        /* KHUNG CHUNG */
        .box-wrapper {
            width: 100%; max-width: 650px; background-color: rgba(13, 34, 64, 0.9); border: 1px solid #3a6b9c;
            border-radius: 12px; padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); backdrop-filter: blur(8px);
        }
        .box-title { color: #ffcc00; text-align: center; font-size: 22px; text-transform: uppercase; margin-bottom: 25px; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }

        /* FORM NHẬP LIỆU */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: #ffcc00; font-size: 16px; margin-bottom: 8px; font-weight: bold; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px 15px; background-color: rgba(20, 45, 80, 0.6); border: 1px solid #3a6b9c;
            border-radius: 8px; color: #ffffff; font-size: 16px; outline: none; transition: all 0.3s ease; font-family: Arial, sans-serif;
        }
        .form-group select option { background-color: #0b1a30; color: #ffffff; padding: 10px; }
        .form-group input:focus, .form-group select:focus { border-color: #ffcc00; box-shadow: 0 0 10px rgba(255, 204, 0, 0.4); background-color: rgba(20, 45, 80, 0.9); }

        /* NÚT BẤM */
        .btn {
            width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold;
            text-transform: uppercase; cursor: pointer; transition: all 0.3s ease; font-family: 'Times New Roman', Times, serif; letter-spacing: 1px;
        }
        .btn-start { background-color: #ffcc00; color: #000000; box-shadow: 0 4px 0 #b38f00; }
        .btn-start:hover { background-color: #ffdb4d; transform: translateY(-2px); box-shadow: 0 6px 0 #b38f00; }
        .btn-start:active { transform: translateY(2px); box-shadow: 0 2px 0 #b38f00; }
        
        /* CSS nút khi bị khóa (đã chuyển xuống đây cho gọn) */
        .btn-start:disabled {
            background-color: #8a7300;
            color: #333;
            box-shadow: none;
            transform: none;
            cursor: not-allowed;
        }

        /* GIAO DIỆN LÀM BÀI THI */
        .quiz-header { 
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
            margin-bottom: 25px; border-bottom: 2px solid rgba(255, 204, 0, 0.3); padding-bottom: 15px; 
        }
        .quiz-header span { 
            color: #ffcc00; font-size: 16px; font-weight: bold; background: rgba(255, 204, 0, 0.1);
            padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(255, 204, 0, 0.2);
        }
         /* Đồng hồ đếm thời gian */
        #timer {
            color: #ffffff !important;
            background: rgba(220, 53, 69, 0.3) !important;
            border: 1px solid #dc3545 !important;
            font-family: 'Courier New', monospace;
            font-size: 18px !important;
            letter-spacing: 2px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(220, 53, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }
        
        .question-text { font-size: 19px; line-height: 1.6; margin-bottom: 25px; color: #e0e0e0; font-weight: 500; }
        
        /* CÁC ĐÁP ÁN */
        .option-label {
            display: flex; align-items: flex-start; background-color: rgba(20, 45, 80, 0.5); border: 1px solid #3a6b9c;
            border-radius: 8px; padding: 15px 20px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s ease; font-size: 17px; line-height: 1.5;
        }
        .option-label:hover { background-color: rgba(58, 107, 156, 0.7); border-color: #5a9bd6; transform: translateX(5px); }
        .option-label input {
            margin-right: 15px; margin-top: 4px; transform: scale(1.4); accent-color: #ffcc00; cursor: pointer; flex-shrink: 0;
        }
        .option-label.selected { 
            background-color: rgba(58, 107, 156, 0.9); border-color: #ffcc00; box-shadow: 0 0 12px rgba(255, 204, 0, 0.3); 
        }
        .option-label.correct-answer {
            background-color: rgba(40, 167, 69, 0.4) !important;
            border-color: #28a745 !important;
            box-shadow: 0 0 15px rgba(40, 167, 69, 0.6);
            transform: translateX(5px);
        }
        .option-label.wrong-answer {
            background-color: rgba(220, 53, 69, 0.4) !important;
            border-color: #dc3545 !important;
            box-shadow: 0 0 15px rgba(220, 53, 69, 0.6);
            transform: translateX(5px);
        }
        .option-label input:disabled { cursor: not-allowed; }
        .option-label.locked { cursor: not-allowed; }

        /* KẾT QUẢ */
        .result-score { font-size: 52px; color: #ffcc00; text-align: center; margin: 20px 0; font-weight: bold; text-shadow: 2px 2px 5px rgba(0,0,0,0.5); }
        .result-text { font-size: 20px; text-align: center; margin-bottom: 30px; line-height: 1.5; }

        .hidden { display: none !important; }

        /* Responsive cho điện thoại */
        @media (max-width: 600px) {
            .header h1 { font-size: 20px; }
            .header h2 { font-size: 16px; }
            .header h3 { font-size: 18px; }
            .box-wrapper { padding: 20px; }
            .quiz-header { flex-direction: column; align-items: flex-start; }
            .quiz-header span { width: 100%; text-align: center; }
            .question-text { font-size: 17px; }
            .option-label { font-size: 15px; padding: 12px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Phần Tiêu Đề -->
        <header class="header">
            <h3>BỘ TƯ LỆNH CẢNH SÁT CƠ ĐỘNG</h3>
            <h2>TRUNG ĐOÀN CSCĐ SỐ 8</h2>
            <h1>TIỂU ĐOÀN BVMT VÀ BVHĐB</h1>
            
            <div class="logo-container">
                <img src="logo.png" alt="Logo Cảnh sát cơ động" onerror="this.style.display='none'">
            </div>
        </header>

        <!-- MÀN HÌNH 1: ĐĂNG NHẬP -->
        <div id="login-screen" class="box-wrapper">
            <div class="box-title">THÔNG TIN NGƯỜI DỰ THI</div>
            <form id="examForm" onsubmit="startExam(event)">
                <div class="form-group">
                    <label for="fullname">Họ và tên</label>
                    <input type="text" id="fullname" placeholder="Nhập họ và tên" required>
                </div>
                <div class="form-group">
                    <label for="unit">Đơn vị</label>
                    <select id="unit" required>
                        <option value="" disabled selected>-- Chọn đơn vị --</option>
                        <option value="Tổ Tham mưu">Tổ Tham mưu</option>
                        <option value="Tổ Chính trị">Tổ Chính trị</option>
                        <option value="Tổ Hậu cần">Tổ Hậu cần</option>
                        <option value="Đại đội 1">Đại đội 1</option>
                        <option value="Đại đội 2">Đại đội 2</option>
                        <option value="Đại đội 3">Đại đội 3</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="phone">Số điện thoại</label>
                    <input type="tel" id="phone" placeholder="Nhập số điện thoại (10-11 số)" pattern="[0-9]{10,11}" minlength="10" maxlength="11" title="Số điện thoại phải bao gồm 10 hoặc 11 chữ số" required>
                </div>
                <button type="submit" class="btn btn-start">BẮT ĐẦU THI</button>
            </form>
        </div>

        <!-- MÀN HÌNH 2: LÀM BÀI THI -->
        <div id="quiz-screen" class="box-wrapper hidden">
            <div class="quiz-header">
                <span id="question-counter">Câu 1 / 30</span>
                <span id="timer">00:00</span>
                <span id="candidate-name">Thí sinh: Nguyễn Văn A</span>
            </div>
            <div id="question-text" class="question-text">Nội dung câu hỏi...</div>
            <div id="options-container"></div>
            <button id="next-btn" class="btn btn-start" onclick="nextQuestion()" style="margin-top: 20px;">CÂU TIẾP THEO</button>
        </div>

        <!-- MÀN HÌNH 3: KẾT QUẢ -->
        <div id="result-screen" class="box-wrapper hidden">
            <div class="box-title">KẾT QUẢ BÀI THI</div>
            <div class="result-score" id="final-score">0/30</div>
            <div class="result-text" id="final-message">Chúc mừng bạn đã hoàn thành bài thi!</div>
            <button class="btn btn-start" onclick="location.reload()">LÀM LẠI BÀI THI</button>
        </div>

    </div>
    
    <script>
        // ==========================================
        // 1. NGÂN HÀNG CÂU HỎI
        // ==========================================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxgKSM4v4Ly_h05cHgUdXr78sWPsT-bEUlQnZjXig6cC68Ns3wlkLRjIwBMRtbqa60f1Q/exec";
        const questionBank = [
            {
                question: "Thông tư số 62/2025/TT-BCA quy định về nội dung nào sau đây ?",
                options: ["A. Hoạt động tuần tra, kiểm soát của Cảnh sát cơ động", "B. Hoạt động vũ trang canh gác bảo vệ mục tiêu của Cảnh sát cơ động", "C. Công tác huấn luyện của Cảnh sát cơ động", "D. Công tác nghiệp vụ cơ bản của lực lượng Cảnh sát nhân dân"],
                correct: 1
            },
            {
                question: "Theo Điều 2, đối tượng áp dụng của Thông tư bao gồm ?",
                options: ["A. Chỉ cán bộ, chiến sĩ Cảnh sát cơ động", "B. Chỉ Công an các đơn vị, địa phương được giao nhiệm vụ bảo vệ mục tiêu", "C. Công an các đơn vị, địa phương; cán bộ, chiến sĩ Cảnh sát cơ động được giao nhiệm vụ và các cơ quan, đơn vị, lực lượng, tổ chức khác có liên quan", "D. Tất cả cán bộ, chiến sĩ Công an nhân dân"],
                correct: 2
            },
            {
                question: "Theo nguyên tắc tại Điều 3, hoạt động vũ trang canh gác bảo vệ mục tiêu phải bảo đảm ?",
                options: ["A. Thường xuyên, liên tục 12/24 giờ", "B. Thường xuyên, liên tục 18/24 giờ", "C. Thường xuyên, liên tục 20/24 giờ", "D. Thường xuyên, liên tục 24/24 giờ"],
                correct: 3
            },
            {
                question: "Hoạt động vũ trang canh gác bảo vệ mục tiêu phải gắn với ?",
                options: ["A. Công tác huấn luyện và xây dựng lực lượng", "B. Công tác bảo vệ an ninh quốc gia, bảo đảm trật tự, an toàn xã hội trên địa bàn", "C. Công tác quản lý hành chính về trật tự xã hội", "D. Công tác đối ngoại của Công an nhân dân"],
                correct: 1
            },
            {
                question: "Trong khi làm nhiệm vụ vũ trang canh gác bảo vệ mục tiêu, cán bộ, chiến sĩ phải ?",
                options: ["A. Phục tùng tuyệt đối mệnh lệnh của người chỉ huy", "B. Chỉ chấp hành mệnh lệnh bằng văn bản", "C. Chỉ thực hiện nhiệm vụ khi có sự đồng ý của đồng đội", "D. Chủ động thay đổi nhiệm vụ khi thấy cần thiết"],
                correct: 0
            },
            {
                question: "Hành vi nào sau đây bị nghiêm cấm đối với cán bộ, chiến sĩ khi làm nhiệm vụ tại mục tiêu ?",
                options: ["A. Ghi chép tình hình mục tiêu", "B. Tiếp xúc với người đến liên hệ công tác theo nhiệm vụ", "C. Sử dụng điện thoại di động, trừ trường hợp được cấp có thẩm quyền cho phép", "D. Báo cáo chỉ huy khi phát hiện hiện tượng nghi vấn"],
                correct: 2
            },
            {
                question: "Theo Điều 4, cán bộ, chiến sĩ được bố trí nơi ăn, ở, sinh hoạt trong khu vực mục tiêu phải ?",
                options: ["A. Chỉ chấp hành nội quy của đơn vị", "B. Chỉ chấp hành quy định của cơ quan có mục tiêu bảo vệ", "C. Chấp hành nội quy đơn vị và nghiêm chỉnh thực hiện các quy định của cơ quan có mục tiêu bảo vệ về an ninh, trật tự, an toàn và các quy định khác", "D. Không phải chấp hành nội quy của cơ quan có mục tiêu bảo vệ"],
                correct: 2
            },
            {
                question: "Phương pháp vũ trang canh gác bảo vệ mục tiêu không bao gồm nội dung nào sau đây ?",
                options: ["A. Vũ trang canh gác tại vọng gác và xung quanh khu vực mục tiêu", "B. Cơ động tuần tra kiểm soát bảo vệ mục tiêu", "C. Giám sát, bảo vệ bằng phương tiện, thiết bị kỹ thuật nghiệp vụ", "D. Tổ chức điều tra xét xử các vụ án xảy ra tại mục tiêu"],
                correct: 3
            },
            {
                question: "Các mục tiêu được giao vũ trang canh gác bảo vệ phải được tiến hành ?",
                options: ["A. Điều tra cơ bản", "B. Điều tra hình sự", "C. Điều tra đặc biệt", "D. Điều tra hành chính"],
                correct: 0
            },
            {
                question: "Theo Điều 6, công tác nghiệp vụ cơ bản trong bảo vệ mục tiêu thực hiện theo ?",
                options: ["A. Thông tư số 50/2022/TT-BCA", "B. Thông tư số 54/2022/TT-BCA", "C. Thông tư số 15/2025/TT-BCA", "D. Thông tư số 58/2024/TT-BCA"],
                correct: 2
            },
            {
                question: "Mỗi mục tiêu được giao bảo vệ phải xây dựng ?",

                options: ["A. Chỉ xây dựng phương án bảo vệ", "B. Xây dựng phương án tác chiến để xử lý các tình huống nêu trên", "C. Chờ khi xảy ra vụ việc mới xây dựng phương án", "D. Chỉ xây dựng phương án khi Bộ trưởng yêu cầu"],
                correct: 1

            {
                question: "Cán bộ, chiến sĩ thực hiện nhiệm vụ vũ trang canh gác bảo vệ mục tiêu được trang bị vũ khí, công cụ hỗ trợ, thiết bị kỹ thuật nghiệp vụ, thông tin liên lạc do ?",

                correct: 0
            },
            {
                question: "Đối với tai nạn xảy ra ngoài khu vực mục tiêu, gần vọng gác, cán bộ, chiến sĩ phải ?",
                options: ["A. Không can thiệp vì nằm ngoài mục tiêu", "B. Gọi cứu thương, đồng thời đề nghị Nhân dân hỗ trợ sơ cứu, bảo vệ hiện trường và thông báo Công an sở tại", "C. Chỉ báo cáo chỉ huy, không thực hiện việc khác", "D. Đưa người bị nạn vào mục tiêu bảo vệ"],
                correct: 1
            },

                options: ["A. Cán bộ đốc gác", "B. Chỉ huy ca gác", "C. Tư lệnh Cảnh sát cơ động hoặc Giám đốc Công an cấp tỉnh", "D. Cán bộ phụ trách mục tiêu"],

                options: ["A. Ngày, tuần, tháng", "B. Tuần, tháng, quý, sáu tháng, 01 năm", "C. Tháng, quý, 01 năm", "D. Quý, sáu tháng, 01 năm"],

            {
                question: "Thông tư số 62/2025/TT-BCA có hiệu lực thi hành kể từ ngày nào ?",

        // ==========================================
        // 2. LOGIC XỬ LÝ BÀI THI
        // ==========================================
        
        let currentQuiz = [];
        let currentQuestionIndex = 0;
        let userAnswers = [];
        const TOTAL_QUESTIONS = 30;
        let isAnswered = false;
            let timerInterval = null;      // <-- THÊM: Lưu ID của bộ đếm
        let secondsElapsed = 0;        // <-- THÊM: Số giây đã trôi qua
        let totalTimeUsed = "00:00";   // <-- THÊM: Lưu thời gian hoàn thành
        // Hàm trộn mảng ngẫu nhiên (Fisher-Yates)
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }
                // Bắt đầu chạy đồng hồ
        function startTimer() {
            secondsElapsed = 0;
            document.getElementById('timer').innerText = "00:00";
            
            // Xóa đồng hồ cũ nếu có
            if (timerInterval) clearInterval(timerInterval);
            
            // Cứ mỗi 1 giây thì tăng lên 1
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const minutes = Math.floor(secondsElapsed / 60);
                const seconds = secondsElapsed % 60;
                document.getElementById('timer').innerText = 
                    `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }, 1000);
        }

        // Dừng đồng hồ
        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            const minutes = Math.floor(secondsElapsed / 60);
            const seconds = secondsElapsed % 60;
            totalTimeUsed = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }
        // Bắt đầu thi
        function startExam(event) {
            event.preventDefault();
            
            const name = document.getElementById('fullname').value;
            const unit = document.getElementById('unit').value;
            const phone = document.getElementById('phone').value;

            const phoneRegex = /^[0-9]{10,11}$/;
            if (!phoneRegex.test(phone)) {
                alert("Lỗi: Số điện thoại không hợp lệ!\nVui lòng chỉ nhập số và có độ dài từ 10 đến 11 chữ số.");
                return;
            }

            document.getElementById('candidate-name').innerText = "Thí sinh: " + name + " (" + unit + ")";

            let shuffledBank = shuffleArray([...questionBank]); 
            const numQuestions = Math.min(TOTAL_QUESTIONS, shuffledBank.length);
            currentQuiz = shuffledBank.slice(0, numQuestions);

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');

            currentQuestionIndex = 0;
            userAnswers = new Array(currentQuiz.length).fill(null);
            loadQuestion();

            startTimer(); // <-- THÊM DÒNG NÀY ĐỂ BẮT ĐẦU ĐẾM
        }

        // Tải câu hỏi lên màn hình
        function loadQuestion() {
            const questionData = currentQuiz[currentQuestionIndex];
            isAnswered = false; 
            
            // Khôi phục nút bấm (chỉ khai báo 1 lần duy nhất ở đây)
            const nextBtn = document.getElementById('next-btn');
            nextBtn.disabled = false;
            nextBtn.style.opacity = '1';
            nextBtn.style.cursor = 'pointer';
            
            document.getElementById('question-counter').innerText = `Câu ${currentQuestionIndex + 1} / ${currentQuiz.length}`;
            document.getElementById('question-text').innerText = questionData.question;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = ''; 
            
            questionData.options.forEach((option, index) => {
                const isSelected = userAnswers[currentQuestionIndex] === index;
                const label = document.createElement('label');
                label.className = `option-label ${isSelected ? 'selected' : ''}`;
                
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'answer';
                radio.value = index;
                radio.checked = isSelected;
                radio.onchange = () => selectAnswer(index);
                
                label.appendChild(radio);
                label.appendChild(document.createTextNode(option));
                optionsContainer.appendChild(label);
            });

            // Đổi chữ nút phù hợp (không khai báo lại biến nextBtn)
            if (currentQuestionIndex === currentQuiz.length - 1) {
                nextBtn.innerText = "NỘP BÀI THI";
            } else {
                nextBtn.innerText = "CÂU TIẾP THEO";
            }
        }

        // Lưu đáp án người dùng chọn (Chỉ giữ lại 1 hàm duy nhất)
        function selectAnswer(optionIndex) {
            if (isAnswered) return; // Nếu đã trả lời rồi thì không cho đổi
            userAnswers[currentQuestionIndex] = optionIndex;
            
            const labels = document.querySelectorAll('.option-label');
            labels.forEach((label, index) => {
                if (index === optionIndex) {
                    label.classList.add('selected');
                } else {
                    label.classList.remove('selected');
                }
            });
        }

        // Xử lý khi bấm "Câu tiếp theo" hoặc "Nộp bài"
        function nextQuestion() {
            if (userAnswers[currentQuestionIndex] === null) {
                alert("Vui lòng chọn một đáp án trước khi sang câu tiếp theo!");
                return;
            }

            if (isAnswered) return;

            const nextBtn = document.getElementById('next-btn');
            const questionData = currentQuiz[currentQuestionIndex];
            const selectedAnswer = userAnswers[currentQuestionIndex];
            const correctAnswer = questionData.correct;

            isAnswered = true;

            const labels = document.querySelectorAll('.option-label');
            labels.forEach((label, index) => {
                label.classList.add('locked');
                label.querySelector('input').disabled = true;
                label.classList.remove('selected');

                if (index === correctAnswer) {
                    label.classList.add('correct-answer');
                }
                if (index === selectedAnswer && selectedAnswer !== correctAnswer) {
                    label.classList.add('wrong-answer');
                }
            });

            nextBtn.disabled = true;
            nextBtn.style.opacity = '0.7';
            nextBtn.style.cursor = 'not-allowed';
            
            const isLastQuestion = (currentQuestionIndex === currentQuiz.length - 1);
            nextBtn.innerText = isLastQuestion ? "ĐANG CHẤM ĐIỂM..." : "ĐANG CHUYỂN CÂU...";

            setTimeout(() => {
                nextBtn.disabled = false;
                nextBtn.style.opacity = '1';
                nextBtn.style.cursor = 'pointer';

                if (!isLastQuestion) {
                    currentQuestionIndex++;
                    loadQuestion();
                } else {
                    submitExam();
                }
            }, 500);
        }

                // Chấm điểm và hiển thị kết quả
                // Chấm điểm và hiển thị kết quả
        function submitExam() {
            // Dừng đồng hồ đếm thời gian
            stopTimer();
            
            let score = 0;
            for (let i = 0; i < currentQuiz.length; i++) {
                if (userAnswers[i] === currentQuiz[i].correct) {
                    score++;
                }
            }

            // Lấy lại thông tin thí sinh đã nhập
            const name = document.getElementById('fullname').value;
            const unit = document.getElementById('unit').value;
            const phone = document.getElementById('phone').value;
            const percentage = Math.round((score / currentQuiz.length) * 100);

            // === GỬI KẾT QUẢ LÊN GOOGLE SHEETS ===
            const resultData = {
                name: name,
                unit: unit,
                phone: phone,
                score: score,
                total: currentQuiz.length,
                percentage: percentage,
                timeUsed: totalTimeUsed // <-- Gửi thêm thời gian làm bài
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(resultData)
            }).then(() => {
                console.log("Đã gửi kết quả lên Google Sheets thành công!");
            }).catch((error) => {
                console.error("Lỗi khi gửi kết quả:", error);
            });
            // ======================================

            // Ẩn màn hình làm bài, hiện màn hình kết quả
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            document.getElementById('final-score').innerText = `${score} / ${currentQuiz.length}`;
            
            const percentageEval = (score / currentQuiz.length) * 100;
            let message = "";
            if (percentageEval >= 80) message = "Xuất sắc! Bạn đã hoàn thành rất tốt.";
            else if (percentageEval >= 50) message = "Khá tốt! Hãy cố gắng thêm ở lần sau.";
            else message = "Cần cố gắng nhiều hơn. Hãy ôn tập lại nhé!";
            
            // Hiển thị lời chúc mừng kèm tên đồng chí và thời gian hoàn thành
            document.getElementById('final-message').innerHTML = 
                `Chúc mừng Đồng chí <strong style="color: #ffcc00; font-size: 22px;">${name}</strong> đã hoàn thành bài thi!<br>` +
                `<span style="color: #ffcc00;">⏱ Thời gian làm bài: <strong>${totalTimeUsed}</strong></span><br><br>` +
                `<span style="color: #e0e0e0;">${message}</span>`;
        }
    </script>
